动式","English Only No Chinese","240小时输入输出","2000听力词汇量门槛"]},Tt={no:"01",en:"About",zh:"关于我们",title:"传承老一辈教育理念，破解“哑巴英语”困境",p1:"TIFSC® 海南英语村传承老一辈教育家的教育理念，致力于破解国人“哑巴英语”困境。",p2:"我们兼顾教师培训、成人英语口语训练与青少年全封闭沉浸式听说实训，依托成熟教学体系，打造全语言浸泡环境。",p3:"外教团队以英语母语者为主，融合北美先进语言训练方法，结合国内学习者特点做本土化适配；俱乐部可提供标准化与定制化训练服务，同时积极向中西部地区倾斜优质教育资源，推动英语教育均衡发展。",features:[{n:"01",t:"技能，不是学科",d:"我们用环境倒逼开口，用高强度浸泡突破口语心魔——英语是练出来的技能，不是考出来的学科。"},{n:"02",t:"输出，不是灌输",d:"从“老师讲课为主”转变为“学生开口输出为主”，课堂的主角从来都是学员自己。"},{n:"03",t:"浸泡，不是翻译",d:"全外教、零中教教学，完全复刻海外语言环境，彻底摆脱传统中式英语课堂模式。"},{n:"04",t:"破障，不是刷题",d:"害怕犯错、害羞怯场、习惯性自我否定……开不了口的心理障碍，才是营地要逐一拆解的对象。"}],stats:[{v:"3",u:"周",l:"全封闭营期"},{v:"240",u:"h",l:"纯口语输出时长"},{v:"4",u:"×",l:"普通班口语训练量"},{v:"0",u:"",l:"中教 / 刷题 / 应试"}],linkText:"查看三周浸泡营具体由来",modal:{title:"关于TIFSC",founder:{name:"余国良博士 (Dr.Danny Yu)",titles:"美籍爱国华侨、国家友谊奖获得者、北大版大学英语视听说教材总主编全封浸英语口语训练体系创始人"},paragraphs:["TIFSC全封浸外语俱乐部（Total Immersion Foreign Studies Club），创办初衷是传承老一辈教育家的教育精神，探索全语言环境下的英语教学实践，减轻国内英语教与学两端的负担。","机构业务覆盖三大方向：中小学英语教师口语与教学法培训、成人英语口语能力训练，以及青少年全封闭沉浸式听说技能实训，为教育研究者、家长与参训教师提供真实实践案例。在合规前提下，推动解决长期存在的哑巴英语问题。","教学体系基于余博士的研究成果升级而来，通过市场化落地，形成适配中国学情的训练方案，支持标准化与定制化服务。外教团队以英语母语国家教师为主体，辅以优秀非母语专业师资；课程借鉴北美语言训练理念，结合国内学习者特征做针对性调整，训练过程兼顾严谨、友好与趣味性。","我们希望优质教育资源可以惠及更多地区，优先向中西部欠发达地区倾斜，欢迎各界有识之士共同助力国内英语教育质量均衡发展。"]}},yl={no:"02",en:"Program",zh:"核心项目",title:"三周全封闭外教浸泡营",sub:"全新一期于 2026 年 10 月 8 日正式开营，面向全社会招生。",camp:{badge:"新一期 · 招募中",title:"三周全封浸®外语俱乐部",date:"2026 年 10 月 8 日开营",points:["全外教、零中教，完全复刻海外语言环境","全程 English Only，用环境倒逼开口","无废话、无刷题、无应试内容","三周累计 240 小时纯口语沉浸式输出训练"]},path:{title:"三周成长路径：三级能力跃迁",goal:"短期高强度闭环训练，快速打破“看得懂、听不懂、说不出”的常态瓶颈。",steps:[{n:"01",t:"单词认知理解",d:"词汇在真实语境中被激活，从“认得”走向“听得见”。"},{n:"02",t:"整句语篇理解",d:"从听词到听句、听篇章，理解不再依赖“中文字幕”。"},{n:"03",t:"自然流利听说",d:"表达不再经过翻译，开口成为自然的本能。"}]},compare:{title:"同样的一个月，4 倍的练习量",note:"普通语言班以 1 个月为周期（每天 8 小时课程均分听说读写）计算。",standard:{who:"市面普通语言班",len:"1 个月 · 每天 8 小时",items:["听说读写均分课时，真实口语有效练习每天不足 2 小时","整月有效口语训练时长约 60 小时"]},tifsc:{who:"TIFSC 三周浸泡营",len:"3 周 · 全封闭",items:["全程无废话、无刷题、无应试内容","三周累计 240
